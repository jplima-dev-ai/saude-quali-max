name: Qualidade

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências Python
        run: python -m pip install -r requirements.txt
      - name: Verificar dependências Python
        run: python -c "from lxml import html; print('lxml disponível no CI')"
      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependências Node
        run: npm ci
      - name: Conferir formatação
        run: npm run format:check
      - name: Conferir métricas reproduzíveis
        run: npm run metrics
      - name: Executar suíte histórica e sintaxe
        run: npm test
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar jornadas e Axe
        run: npm run test:e2e
      - name: Gerar build público
        run: npm run build
      - name: Guardar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
